<h2 mat-dialog-title>{{ isEdit ? 'Zutat bearbeiten' : 'Zutat anlegen' }}</h2>

<form (submit)="onSubmit($event)">
  <mat-dialog-content class="form-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput [formField]="ingredientForm.name" />
      @if (ingredientForm.name().invalid() && ingredientForm.name().touched()) {
        <mat-error>{{ ingredientForm.name().errors()[0]?.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Einheit</mat-label>
      <mat-select [formField]="ingredientForm.unitId">
        <mat-option [value]="null">(keine Einheit)</mat-option>
        @for (unit of units; track unit.id) {
          <mat-option [value]="unit.id">{{ unit.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Abbrechen</button>
    <button mat-raised-button color="primary" type="submit">Speichern</button>
  </mat-dialog-actions>
</form>
