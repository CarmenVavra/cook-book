<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/">
    <mat-icon fontSet="fa-solid" fontIcon="fa-utensils"></mat-icon>
    <span>Cookbook</span>
  </a>

  <nav class="nav-links">
    <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Start</a>
    <a mat-button routerLink="/recipes" routerLinkActive="active-link">Rezepte</a>
    @if (auth && (auth.isAuthenticated$ | async)) {
      <a mat-button routerLink="/category" routerLinkActive="active-link">Kategorien</a>
      <a mat-button routerLink="/country" routerLinkActive="active-link">Länder</a>
      <a mat-button routerLink="/type" routerLinkActive="active-link">Typen</a>
      <a mat-button routerLink="/my-recipes" routerLinkActive="active-link">Meine Rezepte</a>
    }
  </nav>

  <span class="spacer"></span>

  @if (auth) {
    @if (auth.isAuthenticated$ | async) {
      <button mat-stroked-button type="button" (click)="logout()">Abmelden</button>
    } @else {
      <button mat-button type="button" (click)="auth.loginWithPopup()">Anmelden</button>
      <button mat-raised-button color="primary" type="button"
        (click)="auth.loginWithPopup({ authorizationParams: { screen_hint: 'signup' } })">
        Registrieren
      </button>
    }
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
