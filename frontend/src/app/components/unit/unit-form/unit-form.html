<h2 mat-dialog-title>{{ isEdit ? 'Maßeinheit bearbeiten' : 'Maßeinheit anlegen' }}</h2>

<form (submit)="onSubmit($event)">
  <mat-dialog-content class="form-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput [formField]="unitForm.name" />
      @if (unitForm.name().invalid() && unitForm.name().touched()) {
        <mat-error>{{ unitForm.name().errors()[0]?.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Kurzform</mat-label>
      <input matInput [formField]="unitForm.nameShort" placeholder="z. B. kg" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Abbrechen</button>
    <button mat-raised-button color="primary" type="submit">Speichern</button>
  </mat-dialog-actions>
</form>
